<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>Guess the number</title>
    </head>

    <body>
        <!--what people see first-->
        <main id="game-page">
        <h1>Guess the number</h1>
        <p>I'm thinking of a number between 1 and 100.</p>

            <input type="text" id="guess-input" placeholder="Enter your guess...">
        
            <p id="attempts">Attempts: 0</p>

            <button id="guess-btn">
                SUBMIT GUESS
            </button>

            <p id="feedback"></p>

      </main>

      <!--hidden until the user wins -->
      <main id="victory-page" class="hidden">

        <h1>Congratulations :)</h1>
        <p>You guessed the secret number!!</p>
        
        <div class="victory-number">
        <span id="secret-number"></span>

        <p id="final-attempts"></p>
        <button id="restart-btn">PLAY AGAIN</button>
        </div>
      </main>

      <!--hidden until-->
      <main id="-page" class="hidden">
        <h1></h1>
        <p></p>
      </main>
      <audio id="music" src="sounds/music.mp3"></audio>
      <script src="script.js"></script>
    </body>
</html>
